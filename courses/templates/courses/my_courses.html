{% extends "base.html" %}

{% block content %}
<h2>My Courses</h2>

{% if courses %}
<div class="row">
    {% for course in courses %}
    <div class="col-md-4">
        <div class="card mb-3">

            {% if course.thumbnail %}
            <img src="{{ course.thumbnail.url }}" class="card-img-top">
            {% endif %}

            <div class="card-body">
                <h5>{{ course.title }}</h5>

                <a href="{% url 'courses:course_detail' course.pk %}" class="btn btn-primary">
                    Continue Learning
                </a>
            </div>

        </div>
    </div>
    {% endfor %}
</div>
{% else %}
<p>You haven't enrolled in any courses yet.</p>
{% endif %}

{% endblock %}
