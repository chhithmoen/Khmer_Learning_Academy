<!DOCTYPE html>

<html lang="km">

<head>

<meta charset="UTF-8">

<title>
{{ lesson.title }}
</title>


<link 
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">


</head>


<body>


<nav class="navbar navbar-dark bg-primary">

<div class="container">

<a class="navbar-brand">

🎓 Khmer Learning Academy

</a>

</div>

</nav>




<div class="container mt-5">


<div class="row">


<div class="col-md-8">



<h1 class="fw-bold">

🎬 {{ lesson.title }}

</h1>


<hr>



<!-- Video Player -->


<div class="ratio ratio-16x9 mb-4">


{% if lesson.video_url %}


<iframe

src="{{ lesson.video_url }}"

allowfullscreen>

</iframe>


{% else %}


<div class="bg-dark text-white d-flex align-items-center justify-content-center">

No Video Available

</div>


{% endif %}


</div>




<h3>

📖 Lesson Content

</h3>



<p>

{{ lesson.content }}

</p>



<button class="btn btn-success">

✅ Mark as Complete

</button>



</div>





<div class="col-md-4">


<div class="card shadow">


<div class="card-body">


<h4>

{{ course.title }}

</h4>


<hr>


<h5>
Lessons
</h5>


{% for item in course.lessons.all %}


<a class="d-block mb-2">

▶ {{ item.title }}

</a>


{% endfor %}



</div>


</div>



</div>



</div>



</div>



</body>

</html>
